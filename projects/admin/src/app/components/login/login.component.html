<div class="login-wrapper">
  <div class="login-card">
    <div class="login-header">
      <h1 class="login-title">Smart Grocery</h1>
      <p class="login-subtitle">Admin Portal</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div *ngIf="loginError" class="alert alert-danger py-2">{{ loginError }}</div>

      <div class="mb-3">
        <label for="username" class="form-label">Username</label>
        <input
          id="username"
          type="text"
          class="form-control"
          formControlName="username"
          placeholder="Enter username"
          autocomplete="username"
        />
        <div *ngIf="f['username'].touched && f['username'].invalid" class="field-error">
          Username is required
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <input
          id="password"
          type="password"
          class="form-control"
          formControlName="password"
          placeholder="Enter password"
          autocomplete="current-password"
        />
        <div *ngIf="f['password'].touched && f['password'].invalid" class="field-error">
          Password is required
        </div>
      </div>

      <button
        type="submit"
        class="btn btn-primary w-100"
        [disabled]="loginForm.invalid || isSubmitting"
      >
        <span *ngIf="isSubmitting">
          <i class="fa fa-spinner fa-pulse fa-fw"></i> Signing in...
        </span>
        <span *ngIf="!isSubmitting">Sign In</span>
      </button>
    </form>

    <p class="switch-link">Don't have an account? <a routerLink="/signup">Sign Up</a></p>
  </div>
</div>
